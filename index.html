html{font-size:16px} html.f2{font-size:18.5px} html.f3{font-size:21px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;font-feature-settings:"tnum" 1;padding-bottom:calc(5.6rem + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}
svg.i{width:1.25em;height:1.25em;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}
.wrap{max-width:540px;margin:0 auto;padding:0 1rem}
header.top{padding:calc(1rem + env(safe-area-inset-top)) 0 .4rem}
header.top .wrap{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem}
header.top .brand{font-size:.8rem;font-weight:700;color:var(--forest);display:flex;align-items:center;gap:.35rem;margin-bottom:.35rem}
header.top .brand i{width:.55rem;height:.55rem;border-radius:50%;background:var(--lime);box-shadow:0 0 0 2px var(--forest) inset}

.who{display:inline-flex;align-items:center;gap:.35rem;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.45rem .8rem;font-size:.8rem;font-weight:700;white-space:nowrap}
.card{background:var(--card);border-radius:var(--r-lg);padding:1.1rem;margin:.75rem 0;border:1px solid var(--line)}
.sec-title{font-size:.875rem;font-weight:700;color:var(--muted);margin:1.4rem .1rem .5rem;letter-spacing:0}
.card .sec-title{margin:0 0 .6rem}

.muted{color:var(--muted)} .small{font-size:.8125rem}
.row{display:flex;align-items:center;gap:.6rem}

.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.green{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.btn.red{background:var(--card);border-color:#E8C3BC;color:var(--red)}
.btn.block{width:100%}
.btn.sm{min-height:2.25rem;padding:.25rem .8rem;font-size:.8125rem}
.next{background:var(--lime);border-color:var(--lime);padding:1.25rem}
.next .when{font-size:3.5rem;font-weight:800;line-height:.95;letter-spacing:-.05em;margin:.6rem 0 .5rem}
.next .meds{font-size:1.05rem;font-weight:700;line-height:1.35}
.next .btn.green{background:var(--ink);border-color:var(--ink);color:#fff}
.next.late{background:var(--red2);border-color:#F0C6BE}

.next.ok{background:var(--green2);border-color:#CBE5D5}

.med.done .box{background:var(--lime);border-color:var(--lime)}
.med.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.med.late:not(.done):not(.rotina) .box{border-color:var(--red)}
.med .nm{font-weight:700;font-size:1rem}
.med .dt{font-size:.8125rem;color:var(--muted)}
.med .by{font-size:.75rem;color:var(--green);font-weight:600}
.med.rotina .nm{font-weight:500;color:var(--muted)}

.ev .chk svg.i{width:1.1rem;height:1.1rem;stroke-width:2.5}
.ev.done .chk{background:var(--lime);border-color:var(--lime)}

.alert.amber{background:var(--amber2);color:var(--amber)}

.heat span{font-size:.6875rem;color:var(--muted);font-weight:700}
.heat b{font-size:.6875rem;font-weight:700}
svg.chart{width:100%;height:auto;display:block}
.entry{border-top:1px solid var(--line);padding:.9rem 0}

.fact.hl{background:var(--lime2)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-weight:600;font-size:.9rem;cursor:pointer;min-height:2.6rem}

textarea.in{min-height:5.5rem;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:3px solid var(--lime);border-color:var(--forest)}

.sheet{background:var(--bg);width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:.6rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));animation:up .22s ease-out}

.logo{width:3.5rem;height:3.5rem;border-radius:18px;background:var(--lime);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;color:var(--ink)}

.keypad button{min-height:3.75rem;font-size:1.5rem;font-weight:700;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6.2rem + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:999px;font-weight:600;font-size:.9rem;z-index:80;max-width:90vw;text-align:center}
.demo{background:var(--amber2);color:var(--amber);font-weight:700;text-align:center;font-size:.75rem;padding:.4rem}
.list-btn{display:flex;align-items:center;gap:.8rem;width:100%;background:transparent;border:0;border-top:1px solid var(--line);padding:.95rem .1rem;font-weight:600;font-size:.95rem;text-align:left;cursor:pointer}

.list-btn .ico{width:2.25rem;height:2.25rem;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.list-btn .grow{flex:1}
.list-btn .chev{color:var(--faint)}
.hide{display:none!important}
</style>

/* ================= BACKEND ================= */
const api = DEMO ? (()=> {
  const KEY = "cj_demo_items";
  const load = () => LS.get(KEY, null);
  const save = a => LS.set(KEY, a);
  const check = pin => pin === "1234";
  return {
    async list(pin){ if(!check(pin)) return {error:"pin"}; return {items: load() || []}; },
    async save(pin,id,kind,data,who){ if(!check(pin)) return {error:"pin"};
      const a = load() || []; const it = {id:id||uuid(),kind,data,updated_at:new Date().toISOString(),updated_by:who};
      const i = a.findIndex(x=>x.id===it.id); if(i>=0) a[i]=it; else a.push(it); save(a); return {item:it}; },
    async del(pin,id){ if(!check(pin)) return {error:"pin"}; save((load()||[]).filter(x=>x.id!==id)); return {ok:true}; },
    async setPin(){ return {error:"demo"}; }
  };
})() : (()=> {
  async function rpc(fn, args){
    const r = await fetch(`${CONFIG.supabaseUrl}/rest/v1/rpc/${fn}`, {
      method:"POST",
      headers:{ "apikey":CONFIG.supabaseKey, "Content-Type":"application/json" },
      body: JSON.stringify(args)
    });
    if(!r.ok) throw new Error("rede "+r.status);
    return r.json();
  }
  return {
    list:(pin)=>rpc("fam_list",{p_pin:pin}),
    save:(pin,id,kind,data,who)=>rpc("fam_save",{p_pin:pin,p_id:id||null,p_kind:kind,p_data:data,p_who:who}),
    del:(pin,id)=>rpc("fam_delete",{p_pin:pin,p_id:id}),
    setPin:(pin,nw)=>rpc("fam_set_pin",{p_pin:pin,p_new:nw})
  };
})();

    try{

/* ---------- HOJE ---------- */
function slotsFor(day){
  const map = new Map();
  meds().forEach(m=>{ if(!map.has(m.data.time)) map.set(m.data.time, []); map.get(m.data.time).push(m); });
  return [...map.entries()].map(([time,list])=>({time,list}));
}
function nextSlot(){
  const t = today(), now = hmToMin(nowHM());
  const slots = slotsFor(t);
  for(const s of slots){
    const pend = s.list.filter(m=>m.data.type!=="rotina" && !doseFor(t,m.id));
    if(pend.length) return {...s, pend, late: hmToMin(s.time) < now - 15, diff: hmToMin(s.time)-now};
  }
  return null;
}
function renderHoje(main){
  const d = S.day, isToday = d===today(), now = hmToMin(nowHM());
  const slots = slotsFor(d);
  const all = slots.flatMap(s=>s.list).filter(m=>m.data.type!=="rotina");
  const done = all.filter(m=>doseFor(d,m.id)).length;
  let html = "";
  if(isToday){
    const ns = nextSlot();
    if(ns){
      const when = ns.diff>0 ? `em ${ns.diff>=60?Math.floor(ns.diff/60)+"h"+pad(ns.diff%60):ns.diff+" min"}` : (ns.late?`Atrasado ${-ns.diff>=60?Math.floor(-ns.diff/60)+"h"+pad(-ns.diff%60):-ns.diff+" min"}`:"Agora");
      html += `<div class="card next ${ns.late?"late":""}">
        <div class="row" style="justify-content:space-between"><span class="pill ${ns.late?"red":""}">${ic("clock")} Próximo remédio</span><b class="small">${when}</b></div>
        <div class="when">${ns.time}</div>
        <div class="meds">${ns.pend.map(m=>esc(m.data.name)).join(", ")}</div>
        <button class="btn green block" style="margin-top:1rem;min-height:3.4rem" onclick="giveSlot('${ns.time}')">${ic("check")} Dei esses remédios</button>
      </div>`;
    } else if(all.length){
      html += `<div class="card next ok"><span class="pill green">${ic("check")} Tudo em dia</span><div class="big" style="margin-top:.6rem">Todos os remédios de hoje foram dados</div></div>`;
    }
    const evs = byKind("event").filter(e=>e.data.date===d && !e.data.done).sort((a,b)=>(a.data.time||"").localeCompare(b.data.time||""));
    evs.forEach(e=> html += `<div class="alert blue" onclick="go('agenda')">${ic("calendar")}<span>Hoje ${e.data.time?"às "+esc(e.data.time):""}: <b>${esc(e.data.title)}</b>${e.data.place?", "+esc(e.data.place):""}</span></div>`);
    const tm = byKind("event").filter(e=>e.data.date===addDays(d,1) && !e.data.done);
    tm.forEach(e=> html += `<div class="alert blue" onclick="go('agenda')">${ic("calendar")}<span>Amanhã ${e.data.time?"às "+esc(e.data.time):""}: <b>${esc(e.data.title)}</b></span></div>`);
  }
  html += `<div class="card"><div class="daynav">
      <button class="btn sm" aria-label="Dia anterior" onclick="S.day=addDays(S.day,-1);render()">${ic("left")}</button>
      <div style="text-align:center"><b>${isToday?"Hoje":relDay(d)}</b><div class="small muted">${fmtDay(d)}</div></div>
      <button class="btn sm" aria-label="Próximo dia" onclick="S.day=addDays(S.day,1);render()" ${isToday?"disabled style='opacity:.3'":""}>${ic("right")}</button>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:.8rem"><b>${done} de ${all.length} remédios dados</b><span class="small muted">${all.length?Math.round(done/all.length*100):0}%</span></div>
    <div class="progress"><div style="width:${all.length?Math.round(done/all.length*100):0}%"></div></div>
  </div>`;
  if(!slots.length) html += `<div class="card">Nenhum remédio cadastrado. Vá em <b>Mais → Lista de remédios</b>.</div>`;
  slots.forEach(s=>{
    const late = isToday && hmToMin(s.time) < now - 15 || d < today();
    const sp = s.list.filter(m=>m.data.type!=="rotina"), sd = sp.filter(m=>doseFor(d,m.id)).length;
    html += `<div class="slot"><div class="slot-h"><span class="t">${s.time}</span><span class="state">${sp.length? (sd===sp.length?"Concluído":`${sd}/${sp.length}`):""}</span></div><div class="slot-list">`;
    s.list.forEach(m=>{
      const dose = doseFor(d,m.id);
      html += `<button class="med ${dose?"done":""} ${late?"late":""} ${m.data.type==="rotina"?"rotina":""}" onclick="toggleDose('${m.id}')">
        <span class="box">${dose?ic("check"):(m.data.type==="rotina"?"":"")}</span>
        <span style="flex:1"><span class="nm">${esc(m.data.name)}</span>
          ${m.data.detail?`<br><span class="dt">${esc(m.data.detail)}</span>`:""}
          ${dose?`<br><span class="by">Dado por ${esc(dose.data.by||"")} às ${fmtTime(dose.data.at)}</span>`:""}
          ${dose&&dose.data.obs?`<br><span class="ob">${esc(dose.data.obs)}</span>`:""}
        </span>
        ${m.data.type==="rotina"&&!dose?`<span class="muted">${ic("food")}</span>`:""}
        ${dose?`<span class="btn sm" onclick="event.stopPropagation();doseObs('${dose.id}')" aria-label="Observação">${ic("pen")}</span>`:""}
      </button>`;
    });
    html += `</div></div>`;
  });
  html += `<p class="small muted" style="text-align:center;margin:1.2rem 0">Toque no remédio para marcar. Toque de novo para desmarcar.</p>`;
  main.innerHTML = html;
}
async function toggleDose(medId){
  const d = S.day, dose = doseFor(d, medId);
  const med = S.items.find(i=>i.id===medId);
  if(dose){
    if(!confirm(`Desmarcar ${med.data.name}?\nFoi marcado por ${dose.data.by||"alguém"} às ${fmtTime(dose.data.at)}.`)) return;
    return del(dose.id);
  }
  await save("dose", {date:d, med:medId, by:S.me, at:new Date().toISOString(), obs:""});
}
async function giveSlot(time){
  const t = today();
  const list = slotsFor(t).find(s=>s.time===time).list.filter(m=>m.data.type!=="rotina" && !doseFor(t,m.id));
  for(const m of list) await save("dose", {date:t, med:m.id, by:S.me, at:new Date().toISOString(), obs:""});
  toast("Anotado");
}
function doseObs(id){

function chipRow(field, opts, multi){

function lineChart(points, {min, max, color, unit, ref}){
  if(points.length<1) return `<p class="small muted">Ainda sem dados suficientes.</p>`;
  const W=320,H=130,P=26;
  const xs = points.map((p,i)=> points.length===1? W/2 : P + i*(W-2*P)/(points.length-1));
  const ys = points.map(p=> H-P - (p.v-min)/(max-min)*(H-2*P));
  const path = xs.map((x,i)=>`${i?"L":"M"}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(" ");
  const refY = ref!=null ? H-P-(ref-min)/(max-min)*(H-2*P) : null;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    ${refY!=null?`<line x1="${P}" x2="${W-P}" y1="${refY}" y2="${refY}" stroke="#B8382A" stroke-dasharray="4 4" stroke-width="1.5"/>`:""}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
    ${xs.map((x,i)=>`<circle cx="${x}" cy="${ys[i]}" r="4" fill="#fff" stroke="${color}" stroke-width="2"/>`).join("")}
    ${xs.map((x,i)=> (i===0||i===xs.length-1||points.length<=7)?`<text x="${x}" y="${H-6}" font-size="10.5" font-family="Manrope,sans-serif" text-anchor="middle" fill="#5E6B64">${points[i].l}</text>`:"").join("")}
    <text x="${xs[xs.length-1]}" y="${ys[ys.length-1]-9}" font-size="13" font-family="Manrope,sans-serif" font-weight="800" text-anchor="middle" fill="${color}">${points[points.length-1].v}${unit}</text>
  </svg>`;
}
function renderPainel(main){
  const t = today();
  const ms = meds().filter(m=>m.data.type!=="rotina");
  const doneToday = ms.filter(m=>doseFor(t,m.id)).length;
  const days = [...Array(7)].map((_,i)=>addDays(t,i-6));
  const firstDose = byKind("dose").map(x=>x.data.date).sort()[0] || t;
  const adh = days.filter(d=>d>=firstDose).map(d=>({d, v: ms.length? Math.round(ms.filter(m=>doseFor(d,m.id)).length/ms.length*100):0}));
  const nextEv = byKind("event").filter(e=>e.data.date>=t && !e.data.done).sort((a,b)=>(a.data.date+(a.data.time||"99")).localeCompare(b.data.date+(b.data.time||"99")))[0];
  const diary = byKind("diary").sort((a,b)=>(a.data.date+a.data.time).localeCompare(b.data.date+b.data.time));
  const since14 = addDays(t,-13);
  const painPts = diary.filter(e=>e.data.date>=since14 && e.data.pain!==""&&e.data.pain!=null).map(e=>({v:Number(e.data.pain),l:fmtShort(e.data.date)}));
  const tempPts = diary.filter(e=>e.data.date>=since14 && e.data.temp).map(e=>({v:Number(e.data.temp),l:fmtShort(e.data.date)}));
  const wPts = diary.filter(e=>e.data.weight).slice(-10).map(e=>({v:Number(e.data.weight),l:fmtShort(e.data.date)}));
  const lastBowel = [...diary].reverse().find(e=>e.data.bowel==="Sim"||e.data.bowel==="Diarreia");
  const bowelDays = lastBowel ? daysBetween(lastBowel.data.date, t) : null;
  const lastFood = [...diary].reverse().find(e=>e.data.food);
  const ns = nextSlot();
  const lateCount = slotsFor(t).filter(s=>hmToMin(s.time)<hmToMin(nowHM())-15).flatMap(s=>s.list).filter(m=>m.data.type!=="rotina"&&!doseFor(t,m.id)).length;
  let html = "";
  const alerts = [];
  if(lateCount) alerts.push(["red",`${lateCount} remédio(s) atrasado(s) hoje.`]);
  if(bowelDays!=null && bowelDays>=3) alerts.push(["amber",`${bowelDays} dias sem evacuar pelo diário. Avisar a equipe se passar disso.`]);
  const lastD = diary[diary.length-1]; if(lastD) diaryAlerts(lastD.data).forEach(a=>alerts.push(a));
  if(!diary.some(e=>e.data.date===t)) alerts.push(["blue","Ninguém registrou o diário hoje ainda."]);
  alerts.forEach(([c,tx])=> html += `<div class="alert ${c}" ${c==="blue"?"onclick=\"go('diario')\"":""}>${ic(c==="blue"?"diary":"alert")}<span>${tx}</span></div>`);
  html += `<div class="stat-grid">
    <div class="stat hero" onclick="go('hoje')"><div class="v">${doneToday}/${ms.length}</div><div class="l">remédios dados hoje</div></div>
    <div class="stat" onclick="go('hoje')"><div class="v">${ns?ns.time:"Feito"}</div><div class="l">${ns?"próximo horário":"tudo dado hoje"}</div></div>
    <div class="stat" onclick="go('diario')"><div class="v">${painPts.length?painPts[painPts.length-1].v+"/10":"—"}</div><div class="l">última dor registrada</div></div>
    <div class="stat" onclick="go('diario')"><div class="v" style="font-size:1.2rem">${lastFood?esc(lastFood.data.food):"—"}</div><div class="l">quanto comeu (último)</div></div>
  </div>`;
  if(nextEv) html += `<div class="card" onclick="go('agenda')"><div class="row" style="justify-content:space-between"><span class="sec-title" style="margin:0">Próximo compromisso</span><span class="pill" style="background:var(--lime)">${relDay(nextEv.data.date)==="HOJE"?"Hoje":relDay(nextEv.data.date)==="AMANHÃ"?"Amanhã":relDay(nextEv.data.date)}</span></div>
    <div class="big" style="margin-top:.2rem">${esc(nextEv.data.title)}</div>
    <div class="meta muted small" style="margin-top:.25rem">${fmtDay(nextEv.data.date)}${nextEv.data.time?" às "+esc(nextEv.data.time):""}${nextEv.data.place?", "+esc(nextEv.data.place):""}</div></div>`;
  const adhMap = Object.fromEntries(adh.map(a=>[a.d,a.v]));
  html += `<div class="card"><div class="sec-title">Remédios dados nos últimos 7 dias</div>
    <div class="heat">${days.map(d=>{ const v=adhMap[d]; const c = v==null?"":v>=90?"full":(d===t?"part":v>=60?"part":"low");
      return `<div><i class="${c} ${d===t?"today":""}" title="${v==null?"sem registro":v+"%"}"></i><span>${DIAS[parseYmd(d).getDay()].slice(0,3)}</span><b>${v==null?"–":v+"%"}</b></div>`;}).join("")}</div>
    <div class="row small muted" style="margin-top:.8rem;gap:1rem;flex-wrap:wrap"><span class="row" style="gap:.35rem"><i style="width:.8rem;height:.8rem;border-radius:4px;background:var(--lime);display:inline-block"></i>90% ou mais</span><span class="row" style="gap:.35rem"><i style="width:.8rem;height:.8rem;border-radius:4px;background:var(--lime2);border:1.5px solid var(--lime);display:inline-block"></i>60 a 89%</span><span class="row" style="gap:.35rem"><i style="width:.8rem;height:.8rem;border-radius:4px;border:1.5px solid var(--red);display:inline-block"></i>abaixo de 60%</span></div></div>`;
  html += `<div class="card"><div class="sec-title">Dor nos últimos 14 dias</div>${lineChart(painPts,{min:0,max:10,color:"#15241D",unit:""})}</div>`;
  html += `<div class="card"><div class="sec-title">Temperatura (linha vermelha: febre, 37,8 °C)</div>${lineChart(tempPts,{min:35,max:40,color:"#1E5A43",unit:"°",ref:37.8})}</div>`;
  html += `<div class="card"><div class="sec-title">Peso</div>${wPts.length>=1?lineChart(wPts,{min:Math.min(...wPts.map(p=>p.v))-3,max:Math.max(...wPts.map(p=>p.v))+3,color:"#1E5A43",unit:"kg"}):'<p class="small muted">Registre o peso no diário (ideal 1x por semana, mesma balança).</p>'}</div>`;
  main.innerHTML = html;
}

  if(!S.loaded) return;
  const hm = nowHM(), key = today()+" "+hm;
  if("Notification" in window && Notification.permission==="granted" && lastNotified!==key){
    const due = meds().filter(m=>m.data.time===hm && m.data.type!=="rotina" && !doseFor(today(),m.id));
    if(due.length){ try{ new Notification("Hora do remédio · "+hm, {body: due.map(m=>m.data.name).join(", "), icon:"icon-192.png"}); }catch(e){} lastNotified=key; LS.set("cj_notified",key); }
  }
  if(!$("#sheet") && (S.tab==="hoje"||S.tab==="painel")) render();
}, 30000);
setInterval(()=>{ if(document.visibilityState==="visible" && !$("#sheet")) refresh(true); }, 20000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") refresh(true); });

render();
if(S.pin) refresh();
</script>
</body>
