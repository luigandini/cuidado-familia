<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuidado José">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cuidado José</title>
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#14181f; --muted:#4b5563; --line:#d9d4c7;
  --blue:#1e3a8a; --blue2:#dbe4ff; --green:#166534; --green2:#dcfce7;
  --red:#b91c1c; --red2:#fee2e2; --amber:#92400e; --amber2:#fef3c7;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:20px}
html.f2{font-size:23px} html.f3{font-size:26px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.35;padding-bottom:calc(5.2rem + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.wrap{max-width:560px;margin:0 auto;padding:0 .8rem}
header.top{background:var(--blue);color:#fff;padding:calc(.7rem + env(safe-area-inset-top)) 0 .8rem}
header.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
header.top h1{font-size:1.15rem;font-weight:800}
header.top .sub{font-size:.8rem;opacity:.9}
.who{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:.35rem .8rem;font-size:.8rem;font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:1rem;margin:.8rem 0;box-shadow:0 1px 0 var(--line),0 2px 10px rgba(0,0,0,.04)}
.sec-title{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:1.2rem .2rem .3rem}
.big{font-size:1.6rem;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.row{display:flex;align-items:center;gap:.7rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:3rem;padding:.5rem 1.1rem;border-radius:14px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:800;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{background:#fff;border-color:var(--red);color:var(--red)}
.btn.block{width:100%}
.btn.sm{min-height:2.3rem;padding:.2rem .8rem;font-size:.85rem;border-width:2px}
.next{border:3px solid var(--blue)}
.next.late{border-color:var(--red);background:var(--red2)}
.next.ok{border-color:var(--green);background:var(--green2)}
.next .when{font-size:2.2rem;font-weight:900;line-height:1}
.pill{display:inline-block;font-size:.75rem;font-weight:800;padding:.15rem .55rem;border-radius:999px;background:var(--blue2);color:var(--blue)}
.pill.red{background:var(--red);color:#fff}.pill.green{background:var(--green);color:#fff}.pill.amber{background:var(--amber2);color:var(--amber)}
.slot{padding:.2rem 0}
.slot-h{display:flex;justify-content:space-between;align-items:center;margin:.4rem 0 .2rem}
.slot-h .t{font-size:1.25rem;font-weight:900}
.med{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:.65rem .75rem;margin:.4rem 0;cursor:pointer}
.med .box{flex:0 0 2.4rem;height:2.4rem;border-radius:10px;border:3px solid #6b7280;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:900;color:#fff}
.med.done{border-color:var(--green);background:var(--green2)}
.med.done .box{background:var(--green);border-color:var(--green)}
.med.late:not(.done){border-color:var(--red)}
.med .nm{font-weight:800;font-size:1.05rem}
.med .dt{font-size:.8rem;color:var(--muted)}
.med.rotina .nm{font-weight:600}
.med .ob{font-size:.8rem;color:var(--amber);font-weight:700}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.daynav button{min-width:3rem}
.ev{display:flex;gap:.8rem;align-items:flex-start;padding:.7rem 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .chk{flex:0 0 2.2rem;height:2.2rem;border-radius:10px;border:3px solid #6b7280;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:1.3rem;cursor:pointer}
.ev.done .chk{background:var(--green);border-color:var(--green)}
.ev.done .tt{text-decoration:line-through;color:var(--muted)}
.ev .tt{font-weight:800}
.ev .body{flex:1;cursor:pointer}
.datehead{font-weight:900;font-size:1.05rem;margin-top:.6rem}
.datehead .rel{font-weight:700;color:var(--blue);font-size:.85rem;margin-left:.3rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:space-around;padding:.3rem .2rem calc(.3rem + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.05rem;padding:.3rem 0;font-size:.72rem;font-weight:800;color:var(--muted);border-radius:12px}
nav.tabs button .ic{font-size:1.5rem;line-height:1}
nav.tabs button.on{color:var(--blue);background:var(--blue2)}
.alert{border-radius:14px;padding:.8rem;margin:.6rem 0;font-weight:700}
.alert.red{background:var(--red2);color:var(--red);border:2px solid var(--red)}
.alert.amber{background:var(--amber2);color:var(--amber);border:2px solid #d97706}
.alert.blue{background:var(--blue2);color:var(--blue);border:2px solid var(--blue)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.stat{background:#fff;border-radius:var(--r);padding:.8rem;box-shadow:0 1px 0 var(--line)}
.stat .v{font-size:1.7rem;font-weight:900;line-height:1.1}
.stat .l{font-size:.75rem;color:var(--muted);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:.35rem;height:6rem;margin-top:.5rem}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.2rem}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--green)}
.bars span{font-size:.65rem;color:var(--muted);font-weight:700}
svg.chart{width:100%;height:auto;display:block}
.entry{border-top:1px solid var(--line);padding:.7rem 0}
.entry:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:.45rem .85rem;font-weight:700;cursor:pointer;min-height:2.6rem}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pain{display:grid;grid-template-columns:repeat(6,1fr);gap:.35rem}
.pain button{min-height:2.8rem;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:1.05rem}
.pain button.on{outline:4px solid var(--ink);outline-offset:-1px}
label.f{display:block;font-weight:800;margin:.9rem 0 .35rem}
input.in,select.in,textarea.in{width:100%;border:2px solid #9ca3af;border-radius:12px;padding:.65rem .75rem;background:#fff;min-height:3rem}
textarea.in{min-height:5.5rem}
input.in:focus,select.in:focus,textarea.in:focus{outline:3px solid var(--blue);border-color:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:1rem 1rem calc(1.2rem + env(safe-area-inset-bottom))}
.sheet h2{font-size:1.25rem;margin-bottom:.3rem}
.sheet .acts{display:flex;gap:.6rem;margin-top:1.2rem;position:sticky;bottom:0;background:var(--bg);padding-top:.6rem}
.sheet .acts .btn{flex:1}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:1.5rem}
.pinbox{display:flex;justify-content:center;gap:.6rem;margin:1rem 0}
.pinbox i{width:1.1rem;height:1.1rem;border-radius:50%;border:3px solid var(--blue)}
.pinbox i.f{background:var(--blue)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:20rem;margin:0 auto}
.keypad button{min-height:4rem;font-size:1.6rem;font-weight:800;border-radius:16px;border:2px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6rem + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:14px;font-weight:700;z-index:80;max-width:90vw;text-align:center}
.demo{background:var(--amber2);color:var(--amber);font-weight:800;text-align:center;font-size:.8rem;padding:.35rem}
.list-btn{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:0;border-top:1px solid var(--line);padding:.95rem .2rem;font-weight:800;text-align:left;cursor:pointer}
.list-btn:first-child{border-top:0}
.sinais li{margin:.35rem 0}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= CONFIGURAÇÃO ================= */
const CONFIG = {
  supabaseUrl: "https://lkmviblxbtnznyxmlsiz.supabase.co",
  supabaseKey: "sb_publishable_JEkTbX-8KE8AGSJpnd9XhQ_4ohxSiMp",
  paciente: "Seu José"
};
const DEMO = !/^https:\/\//.test(CONFIG.supabaseUrl);

/* ================= UTILIDADES ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hmToMin = s => { const [h,m] = (s||"0:0").split(":").map(Number); return h*60+m; };
const DIAS = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fmtDay = s => { const d = parseYmd(s); return `${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]}`; };
const fmtShort = s => { const d = parseYmd(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const fmtTime = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const daysBetween = (a,b) => Math.round((parseYmd(b)-parseYmd(a))/86400000);
const relDay = s => { const n = daysBetween(today(), s);
  if (n===0) return "HOJE"; if (n===1) return "AMANHÃ"; if (n===-1) return "ontem";
  if (n>1) return `em ${n} dias`; return `há ${-n} dias`; };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==="x"?r:(r&3|8)).toString(16)}));
const LS = {
  get:(k,d)=>{ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set:(k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ================= BACKEND ================= */
const api = DEMO ? (()=> {
  const KEY = "cj_demo_items";
  const load = () => LS.get(KEY, null);
  const save = a => LS.set(KEY, a);
  const check = pin => pin === "1234";
  return {
    async list(pin){ if(!check(pin)) return {error:"pin"}; return {items: load() || []}; },
    async save(pin,id,kind,data,who){ if(!check(pin)) return {error:"pin"};
      const a = load() || []; const it = {id:id||uuid(),kind,data,updated_at:new Date().toISOString(),updated_by:who};
      const i = a.findIndex(x=>x.id===it.id); if(i>=0) a[i]=it; else a.push(it); save(a); return {item:it}; },
    async del(pin,id){ if(!check(pin)) return {error:"pin"}; save((load()||[]).filter(x=>x.id!==id)); return {ok:true}; },
    async setPin(){ return {error:"demo"}; }
  };
})() : (()=> {
  async function rpc(fn, args){
    const r = await fetch(`${CONFIG.supabaseUrl}/rest/v1/rpc/${fn}`, {
      method:"POST",
      headers:{ "apikey":CONFIG.supabaseKey, "Content-Type":"application/json" },
      body: JSON.stringify(args)
    });
    if(!r.ok) throw new Error("rede "+r.status);
    return r.json();
  }
  return {
    list:(pin)=>rpc("fam_list",{p_pin:pin}),
    save:(pin,id,kind,data,who)=>rpc("fam_save",{p_pin:pin,p_id:id||null,p_kind:kind,p_data:data,p_who:who}),
    del:(pin,id)=>rpc("fam_delete",{p_pin:pin,p_id:id}),
    setPin:(pin,nw)=>rpc("fam_set_pin",{p_pin:pin,p_new:nw})
  };
})();

/* ================= ESTADO ================= */
const S = {
  pin: LS.get("cj_pin", ""),
  me: LS.get("cj_me", ""),
  tab: "hoje",
  day: today(),
  items: [],
  loaded: false,
  online: true,
  showPast: false
};
const font = LS.get("cj_font", 1);
document.documentElement.classList.toggle("f2", font===2);
document.documentElement.classList.toggle("f3", font===3);

const byKind = k => S.items.filter(i=>i.kind===k);
const meds = () => byKind("med").filter(m=>m.data.active!==false)
  .sort((a,b)=> a.data.time.localeCompare(b.data.time) || (a.data.order||0)-(b.data.order||0));
function doseFor(date, medId){ return S.items.find(i=>i.kind==="dose" && i.data.date===date && i.data.med===medId); }

async function refresh(silent){
  if(!S.pin) return;
  try{
    const r = await api.list(S.pin);
    if(r.error){ if(r.error==="pin"||r.error==="bloqueado"){ S.pin=""; LS.set("cj_pin",""); render(); toast(r.error==="bloqueado"?"Muitas tentativas. Aguarde 15 minutos.":"PIN mudou. Digite de novo."); } return; }
    S.items = r.items; S.online = true;
    if(!S.loaded){ S.loaded = true; if(S.items.length===0) await seed(); }
    LS.set("cj_cache", S.items);
  }catch(e){ S.online=false; if(!S.loaded){ S.items = LS.get("cj_cache", []); S.loaded = true; } if(!silent) toast("Sem internet. Mostrando a última cópia."); }
  render();
}
async function save(kind, data, id){
  const r = await api.save(S.pin, id, kind, data, S.me);
  if(r.error){ toast("Não salvou. Verifique a internet."); return null; }
  const i = S.items.findIndex(x=>x.id===r.item.id);
  if(i>=0) S.items[i]=r.item; else S.items.push(r.item);
  render(); return r.item;
}
async function del(id){
  const r = await api.del(S.pin, id);
  if(r.error){ toast("Não apagou. Verifique a internet."); return; }
  S.items = S.items.filter(x=>x.id!==id); render();
}
async function seed(){ /* dados iniciais carregados direto no banco */ }

/* ================= TELAS ================= */
function render(){
  const app = $("#app");
  if(!S.pin) return renderLogin(app);
  if(!S.me) return renderWho(app);
  if(!S.loaded){ app.innerHTML = `<div class="login"><p class="big" style="text-align:center">Carregando…</p></div>`; return; }
  const titles = {hoje:"Remédios de hoje",agenda:"Consultas e exames",diario:"Diário do paciente",painel:"Visão geral",mais:"Mais opções"};
  app.innerHTML = `
    ${DEMO?'<div class="demo">MODO DEMONSTRAÇÃO · dados só neste aparelho · PIN 1234</div>':""}
    ${!S.online?'<div class="demo">SEM INTERNET · mostrando a última cópia</div>':""}
    <header class="top"><div class="wrap">
      <div><h1>${esc(titles[S.tab])}</h1><div class="sub">${esc(CONFIG.paciente)} · ${fmtDay(today())}</div></div>
      <button class="who" onclick="askWho()">👤 ${esc(S.me)}</button>
    </div></header>
    <main class="wrap" id="main"></main>
    <nav class="tabs">
      ${[["hoje","💊","Hoje"],["agenda","📅","Agenda"],["diario","📝","Diário"],["painel","📊","Painel"],["mais","☰","Mais"]]
        .map(([k,ic,l])=>`<button class="${S.tab===k?"on":""}" onclick="go('${k}')"><span class="ic">${ic}</span>${l}</button>`).join("")}
    </nav>`;
  ({hoje:renderHoje,agenda:renderAgenda,diario:renderDiario,painel:renderPainel,mais:renderMais})[S.tab]($("#main"));
}
function go(t){ S.tab=t; if(t==="hoje") S.day=today(); render(); window.scrollTo(0,0); }

/* ---------- Login ---------- */
let pinTyped = "";
function renderLogin(app){
  app.innerHTML = `<div class="login wrap">
    <div style="text-align:center;font-size:3rem">💙</div>
    <h1 style="text-align:center;font-size:1.5rem">Cuidado ${esc(CONFIG.paciente)}</h1>
    <p class="muted" style="text-align:center">Digite o PIN da família</p>
    ${DEMO?'<p class="small" style="text-align:center"><b>Demonstração: PIN 1234</b></p>':""}
    <div class="pinbox">${[0,1,2,3,4,5].map(i=>`<i class="${i<pinTyped.length?"f":""}"></i>`).join("")}</div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinKey('${n}')">${n}</button>`).join("")}
      <button onclick="pinKey('C')" style="font-size:1rem">Apagar</button>
      <button onclick="pinKey('0')">0</button>
      <button onclick="pinKey('OK')" style="background:var(--blue);color:#fff;font-size:1.1rem">Entrar</button>
    </div></div>`;
}
async function pinKey(k){
  if(k==="C"){ pinTyped = pinTyped.slice(0,-1); return render(); }
  if(k==="OK"){
    if(pinTyped.length<4){ toast("O PIN tem pelo menos 4 números"); return; }
    try{
      const r = await api.list(pinTyped);
      if(r.error){ toast(r.error==="bloqueado"?"Muitas tentativas. Aguarde 15 minutos.":"PIN errado. Tente de novo."); pinTyped=""; return render(); }
      S.pin = pinTyped; LS.set("cj_pin", S.pin); pinTyped=""; S.items=r.items; S.loaded=true;
      if(S.items.length===0) await seed();
      render();
    }catch(e){ toast("Sem internet. Tente de novo."); }
    return;
  }
  if(pinTyped.length<6){ pinTyped += k; render(); if(pinTyped.length===6) pinKey("OK"); }
}

/* ---------- Quem é você ---------- */
function knownPeople(){
  const set = new Set(LS.get("cj_people", []));
  S.items.forEach(i=>{ if(i.updated_by && i.updated_by!=="sistema") set.add(i.updated_by); if(i.data&&i.data.by) set.add(i.data.by); });
  return [...set].filter(Boolean).sort();
}
function renderWho(app){
  const ppl = knownPeople();
  app.innerHTML = `<div class="login wrap">
    <h1 style="font-size:1.5rem">Quem está usando?</h1>
    <p class="muted">Assim a família sabe quem deu cada remédio.</p>
    <div class="chips" style="margin:1rem 0">${ppl.map(p=>`<button class="chip" style="font-size:1.1rem" onclick="setMe(decodeURIComponent('${encodeURIComponent(p)}'))">${esc(p)}</button>`).join("")}</div>
    <label class="f">Ou escreva seu nome</label>
    <input class="in" id="whoName" placeholder="Ex.: Maria" autocomplete="given-name">
    <button class="btn primary block" style="margin-top:1rem" onclick="setMe($('#whoName').value)">Continuar</button>
  </div>`;
}
function setMe(n){
  n = (n||"").trim(); if(!n){ toast("Escreva seu nome"); return; }
  S.me = n; LS.set("cj_me", n);
  const p = LS.get("cj_people", []); if(!p.includes(n)){ p.push(n); LS.set("cj_people", p); }
  render();
}
function askWho(){ S.me=""; LS.set("cj_me",""); render(); }

/* ---------- HOJE ---------- */
function slotsFor(day){
  const map = new Map();
  meds().forEach(m=>{ if(!map.has(m.data.time)) map.set(m.data.time, []); map.get(m.data.time).push(m); });
  return [...map.entries()].map(([time,list])=>({time,list}));
}
function nextSlot(){
  const t = today(), now = hmToMin(nowHM());
  const slots = slotsFor(t);
  for(const s of slots){
    const pend = s.list.filter(m=>m.data.type!=="rotina" && !doseFor(t,m.id));
    if(pend.length) return {...s, pend, late: hmToMin(s.time) < now - 15, diff: hmToMin(s.time)-now};
  }
  return null;
}
function renderHoje(main){
  const d = S.day, isToday = d===today(), now = hmToMin(nowHM());
  const slots = slotsFor(d);
  const all = slots.flatMap(s=>s.list).filter(m=>m.data.type!=="rotina");
  const done = all.filter(m=>doseFor(d,m.id)).length;
  let html = "";
  if(isToday){
    const ns = nextSlot();
    if(ns){
      const when = ns.diff>0 ? `em ${ns.diff>=60?Math.floor(ns.diff/60)+"h"+pad(ns.diff%60):ns.diff+" min"}` : (ns.late?`ATRASADO ${-ns.diff} min`:"AGORA");

        <div class="row" style="justify-content:space-between"><span class="pill ${ns.late?"red":""}">PRÓXIMO REMÉDIO</span><b>${when}</b></div>
        <div class="when" style="margin:.5rem 0">${ns.time}</div>
        <div style="font-size:1.2rem;font-weight:800">${ns.pend.map(m=>esc(m.data.name)).join(" · ")}</div>
        <button class="btn green block" style="margin-top:.8rem;min-height:3.6rem;font-size:1.15rem" onclick="giveSlot('${ns.time}')">✓ Dei esses remédios</button>
      </div>`;
    } else if(all.length){
      html += `<div class="card next ok"><span class="pill green">TUDO EM DIA</span><div class="big" style="margin-top:.4rem">Todos os remédios de hoje foram dados ✓</div></div>`;
    }
    const evs = byKind("event").filter(e=>e.data.date===d && !e.data.done).sort((a,b)=>(a.data.time||"").localeCompare(b.data.time||""));
    evs.forEach(e=> html += `<div class="alert blue" onclick="go('agenda')">📅 Hoje ${e.data.time?"às "+esc(e.data.time):""}: ${esc(e.data.title)}${e.data.place?" · "+esc(e.data.place):""}</div>`);
    const tm = byKind("event").filter(e=>e.data.date===addDays(d,1) && !e.data.done);
    tm.forEach(e=> html += `<div class="alert amber" onclick="go('agenda')">📅 Amanhã ${e.data.time?"às "+esc(e.data.time):""}: ${esc(e.data.title)}</div>`);
  }
  html += `<div class="card"><div class="daynav">
      <button class="btn sm" onclick="S.day=addDays(S.day,-1);render()">◀</button>
      <div style="text-align:center"><b>${isToday?"Hoje":relDay(d)}</b><div class="small muted">${fmtDay(d)}</div></div>
      <button class="btn sm" onclick="S.day=addDays(S.day,1);render()" ${isToday?"disabled style='opacity:.3'":""}>▶</button>
    </div>
    <div style="margin-top:.6rem;font-weight:800">${done} de ${all.length} remédios dados</div>
    <div style="height:.7rem;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:.3rem"><div style="height:100%;width:${all.length?Math.round(done/all.length*100):0}%;background:var(--green)"></div></div>
  </div>`;
  if(!slots.length) html += `<div class="card">Nenhum remédio cadastrado. Vá em <b>Mais → Lista de remédios</b>.</div>`;
  slots.forEach(s=>{
    const late = isToday && hmToMin(s.time) < now - 15 || d < today();
    html += `<div class="slot"><div class="slot-h"><span class="t">🕐 ${s.time}</span></div>`;
    s.list.forEach(m=>{
      const dose = doseFor(d,m.id);
      html += `<button class="med ${dose?"done":""} ${late?"late":""} ${m.data.type==="rotina"?"rotina":""}" onclick="toggleDose('${m.id}')">
        <span class="box">${dose?"✓":""}</span>
        <span style="flex:1"><span class="nm">${m.data.type==="rotina"?"🍽️ ":""}${esc(m.data.name)}</span>
          ${m.data.detail?`<br><span class="dt">${esc(m.data.detail)}</span>`:""}
          ${dose?`<br><span class="dt">✓ ${esc(dose.data.by||"")} às ${fmtTime(dose.data.at)}</span>`:""}
          ${dose&&dose.data.obs?`<br><span class="ob">📌 ${esc(dose.data.obs)}</span>`:""}
        </span>
        ${dose?`<span class="btn sm" onclick="event.stopPropagation();doseObs('${dose.id}')">Obs</span>`:""}
      </button>`;
    });
    html += `</div>`;
  });
  html += `<p class="small muted" style="text-align:center;margin:1.2rem 0">Toque no remédio para marcar. Toque de novo para desmarcar.</p>`;
  main.innerHTML = html;
}
async function toggleDose(medId){
  const d = S.day, dose = doseFor(d, medId);
  const med = S.items.find(i=>i.id===medId);
  if(dose){
    if(!confirm(`Desmarcar ${med.data.name}?\nFoi marcado por ${dose.data.by||"alguém"} às ${fmtTime(dose.data.at)}.`)) return;
    return del(dose.id);
  }
  await save("dose", {date:d, med:medId, by:S.me, at:new Date().toISOString(), obs:""});
}
async function giveSlot(time){
  const t = today();
  const list = slotsFor(t).find(s=>s.time===time).list.filter(m=>m.data.type!=="rotina" && !doseFor(t,m.id));
  for(const m of list) await save("dose", {date:t, med:m.id, by:S.me, at:new Date().toISOString(), obs:""});
  toast("Anotado ✓");
}
function doseObs(id){

function diaryAlerts(d){
  const a = [];

  if(d.swallow==="Entalou") a.push(["red","⚠️ Alimento entalado: se não consegue engolir nem a saliva, ir ao pronto-socorro."]);
  if((d.painSite||[]).includes("Costas") && Number(d.pain)>=7) a.push(["red","⚠️ Dor forte nas costas: se houver fraqueza ou dormência nas pernas ou dificuldade para urinar, pronto-socorro no mesmo dia."]);
  if(d.bpS && Number(d.bpS)<90) a.push(["amber","Pressão baixa (máxima abaixo de 90). Avisar a equipe médica."]);
  if(d.nausea==="Vomitou") a.push(["amber","Vômito: avisar a equipe se repetir ou se não conseguir tomar os remédios."]);

let DF = {};
function chipRow(field, opts, multi){
  return `<div class="chips" data-f="${field}">${opts.map(o=>{
    const on = multi ? (DF[field]||[]).includes(o) : DF[field]===o;
    return `<button type="button" class="chip ${on?"on":""}" onclick="pick('${field}',decodeURIComponent('${encodeURIComponent(o)}'),${multi?1:0})">${esc(o)}</button>`;}).join("")}</div>`;

function pick(field, val, multi){
  if(multi){ const a = DF[field]||[]; DF[field] = a.includes(val)? a.filter(x=>x!==val) : a.concat(val); }
  else DF[field] = DF[field]===val ? "" : val;

function lineChart(points, {min, max, color, unit, ref}){
  if(points.length<1) return `<p class="small muted">Ainda sem dados suficientes.</p>`;
  const W=320,H=130,P=26;
  const xs = points.map((p,i)=> points.length===1? W/2 : P + i*(W-2*P)/(points.length-1));
  const ys = points.map(p=> H-P - (p.v-min)/(max-min)*(H-2*P));
  const path = xs.map((x,i)=>`${i?"L":"M"}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(" ");
  const refY = ref!=null ? H-P-(ref-min)/(max-min)*(H-2*P) : null;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    ${refY!=null?`<line x1="${P}" x2="${W-P}" y1="${refY}" y2="${refY}" stroke="#b91c1c" stroke-dasharray="4 4" stroke-width="1.5"/>`:""}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>
    ${xs.map((x,i)=>`<circle cx="${x}" cy="${ys[i]}" r="4.5" fill="${color}"/>`).join("")}
    ${xs.map((x,i)=> (i===0||i===xs.length-1||points.length<=7)?`<text x="${x}" y="${H-6}" font-size="11" text-anchor="middle" fill="#4b5563">${points[i].l}</text>`:"").join("")}
    <text x="${xs[xs.length-1]}" y="${ys[ys.length-1]-9}" font-size="13" font-weight="800" text-anchor="middle" fill="${color}">${points[points.length-1].v}${unit}</text>
  </svg>`;
}

  </div>`;

    <div class="big" style="font-size:1.3rem">${esc(nextEv.data.title)}</div>

    ${nextEv.data.place?`<div class="muted">${esc(nextEv.data.place)}</div>`:""}</div>`;
  html += `<div class="card"><div class="sec-title" style="margin:0">Remédios dados · últimos 7 dias</div>
    <div class="bars">${adh.map(a=>`<div><span style="color:var(--ink)">${a.v}%</span><i style="height:${Math.max(a.v,3)}%;background:${a.v>=90?"var(--green)":a.v>=60?"#d97706":"var(--red)"}"></i><span>${DIAS[parseYmd(a.d).getDay()].slice(0,3)}</span></div>`).join("")}</div></div>`;
  html += `<div class="card"><div class="sec-title" style="margin:0">Dor · últimos 14 dias</div>${lineChart(painPts,{min:0,max:10,color:"#b91c1c",unit:""})}</div>`;
  html += `<div class="card"><div class="sec-title" style="margin:0">Temperatura · linha vermelha = febre (37,8)</div>${lineChart(tempPts,{min:35,max:40,color:"#1e3a8a",unit:"°",ref:37.8})}</div>`;
  html += `<div class="card"><div class="sec-title" style="margin:0">Peso</div>${wPts.length>=1?lineChart(wPts,{min:Math.min(...wPts.map(p=>p.v))-3,max:Math.max(...wPts.map(p=>p.v))+3,color:"#166534",unit:"kg"}):'<p class="small muted">Registre o peso no diário (ideal 1x por semana, mesma balança).</p>'}</div>`;
  main.innerHTML = html;
}

/* ---------- MAIS ---------- */
function renderMais(main){
  main.innerHTML = `
    <div class="card">
      <button class="list-btn" onclick="medList()">💊 Lista de remédios e horários <span>›</span></button>
      <button class="list-btn" onclick="notes()">💬 Recados da família <span class="pill">${byKind("note").filter(n=>!n.data.sinais).length}</span></button>
      <button class="list-btn" onclick="sinais()">🚨 Sinais de alerta (quando ir ao PS) <span>›</span></button>
      <button class="list-btn" onclick="enableNotif()">🔔 Ativar avisos neste aparelho <span>›</span></button>
    </div>
    <div class="card">
      <div style="font-weight:800;margin-bottom:.5rem">Tamanho da letra</div>
      <div class="row">${[1,2,3].map(n=>`<button class="btn ${font===n?"primary":""}" style="flex:1;font-size:${.8+n*.2}rem" onclick="setFont(${n})">A</button>`).join("")}</div>
    </div>
    <div class="card">
      <button class="list-btn" onclick="askWho()">👤 Trocar quem está usando (${esc(S.me)}) <span>›</span></button>
      <button class="list-btn" onclick="changePin()">🔑 Trocar PIN da família <span>›</span></button>
      <button class="list-btn" onclick="refresh()">🔄 Atualizar agora <span>›</span></button>
      <button class="list-btn" onclick="if(confirm('Sair deste aparelho?')){LS.set('cj_pin','');S.pin='';render()}">🚪 Sair deste aparelho <span>›</span></button>
    </div>
    <p class="small muted" style="text-align:center">Ferramenta de organização da família. Não substitui orientação médica.</p>`;
}
function setFont(n){ LS.set("cj_font", n); location.reload(); }
function medList(){
  const all = byKind("med").sort((a,b)=>a.data.time.localeCompare(b.data.time)||(a.data.order||0)-(b.data.order||0));
  openSheet(`<h2>Remédios e horários</h2><p class="small muted">Toque para editar. Mudanças valem para todos a partir de agora.</p>
    <button class="btn primary block" onclick="closeSheet();editMed()">＋ Adicionar</button>
    <div class="card">${all.map(m=>`<button class="list-btn" onclick="closeSheet();editMed('${m.id}')" style="${m.data.active===false?"opacity:.45":""}">
      <span><b>${esc(m.data.time)}</b> · ${m.data.type==="rotina"?"🍽️ ":""}${esc(m.data.name)}${m.data.active===false?" (suspenso)":""}<br><span class="small muted">${esc(m.data.detail||"")}</span></span><span>›</span></button>`).join("")}</div>`, null, "Fechar");
}
function editMed(id){
  const m = id ? S.items.find(i=>i.id===id) : {data:{time:"08:00",name:"",detail:"",type:"remedio",active:true,order:99}};
  const d = m.data;
  openSheet(`<h2>${id?"Editar":"Novo"} remédio</h2>
    <label class="f">Nome</label><input class="in" id="mN" value="${esc(d.name)}" placeholder="Ex.: Dipirona">
    <label class="f">Horário</label><input class="in" type="time" id="mT" value="${esc(d.time)}">
    <label class="f">Dose / como tomar</label><input class="in" id="mD" value="${esc(d.detail)}" placeholder="Ex.: 1 comprimido, com comida">
    <label class="f">Tipo</label><select class="in" id="mY"><option value="remedio" ${d.type!=="rotina"?"selected":""}>💊 Remédio</option><option value="rotina" ${d.type==="rotina"?"selected":""}>🍽️ Refeição / rotina</option></select>
    <label class="f"><input type="checkbox" id="mA" ${d.active!==false?"checked":""} style="width:1.4rem;height:1.4rem;vertical-align:middle"> Em uso (desmarque para suspender)</label>
    <p class="small muted">Para o mesmo remédio em dois horários, cadastre duas vezes.</p>
    ${id?`<button class="btn red block" onclick="if(confirm('Apagar este remédio da lista?')){closeSheet();del('${id}')}">Apagar</button>`:""}`,
    async ()=>{
      const nd = {...d, name:$("#mN").value.trim(), time:$("#mT").value, detail:$("#mD").value.trim(), type:$("#mY").value, active:$("#mA").checked};
      if(!nd.name||!nd.time){ toast("Preencha nome e horário"); return false; }
      await save("med", nd, id);
    });
}
function notes(){
  const list = byKind("note").filter(n=>!n.data.sinais).sort((a,b)=>(b.data.at||"").localeCompare(a.data.at||""));
  openSheet(`<h2>Recados da família</h2>
    <textarea class="in" id="nT" placeholder="Escreva um recado para todos"></textarea>
    <button class="btn primary block" style="margin-top:.5rem" onclick="addNote()">Enviar recado</button>
    <div class="card">${list.length?list.map(n=>`<div class="entry"><div class="row" style="justify-content:space-between"><b>${esc(n.updated_by||"")}</b><span class="small muted">${n.data.at?fmtShort(ymd(new Date(n.data.at)))+" "+fmtTime(n.data.at):""}</span></div>
      <div>${esc(n.data.text)}</div><button class="btn sm red" style="margin-top:.4rem" onclick="if(confirm('Apagar recado?')){del('${n.id}').then(()=>{closeSheet();notes()})}">Apagar</button></div>`).join(""):'<p class="muted">Nenhum recado.</p>'}</div>`, null, "Fechar");
}
async function addNote(){ const t = $("#nT").value.trim(); if(!t) return; await save("note",{text:t,at:new Date().toISOString()}); closeSheet(); notes(); }
function sinais(){
  const list = byKind("note").filter(n=>n.data.sinais).sort((a,b)=>(a.data.order||0)-(b.data.order||0));
  openSheet(`<h2>🚨 Quando procurar atendimento</h2>
    ${list.length?list.map(n=>`<div class="alert ${n.data.level==="red"?"red":"amber"}">${esc(n.data.text)}</div>`).join(""):'<p class="muted">Nenhuma orientação cadastrada.</p>'}
    <p class="small muted">Leve sempre o resumo clínico e a lista de remédios.</p>`, null, "Fechar");
}
async function enableNotif(){
  if(!("Notification" in window)){ toast("Este aparelho não suporta avisos pelo navegador"); return; }
  const p = await Notification.requestPermission();
  toast(p==="granted"?"Avisos ativados enquanto o app estiver aberto. O alarme garantido é o da Agenda Google.":"Avisos não permitidos");
}
function changePin(){
  if(DEMO){ toast("No modo demonstração o PIN é fixo"); return; }
  openSheet(`<h2>Trocar PIN da família</h2><p class="small muted">Todos vão precisar digitar o PIN novo.</p>
    <label class="f">PIN novo (4 a 6 números)</label><input class="in" id="pN" inputmode="numeric" maxlength="6">`,
    async ()=>{ const n = $("#pN").value.trim(); if(!/^\d{4,6}$/.test(n)){ toast("Use 4 a 6 números"); return false; }
      const r = await api.setPin(S.pin, n); if(r.ok){ S.pin=n; LS.set("cj_pin",n); toast("PIN trocado"); } else { toast("Não trocou"); return false; } });
}

/* ---------- Sheet ---------- */
let sheetSave = null;
function openSheet(html, onSave, closeLabel){
  closeSheet();
  sheetSave = onSave;
  const bg = document.createElement("div"); bg.className="sheet-bg"; bg.id="sheet";
  bg.innerHTML = `<div class="sheet">${html}<div class="acts">
      <button class="btn" onclick="closeSheet()">${closeLabel||"Cancelar"}</button>
      ${onSave?`<button class="btn primary" onclick="doSheetSave(this)">Salvar</button>`:""}
    </div></div>`;
  bg.addEventListener("click", e=>{ if(e.target===bg) closeSheet(); });
  document.body.appendChild(bg); document.body.style.overflow="hidden";
}
function closeSheet(){ const s=$("#sheet"); if(s) s.remove(); document.body.style.overflow=""; }
async function doSheetSave(btn){ btn.disabled=true; btn.textContent="Salvando…"; const r = await sheetSave(); if(r===false){ btn.disabled=false; btn.textContent="Salvar"; return; } closeSheet(); toast("Salvo ✓"); }

/* ---------- Avisos locais e atualização ---------- */
let lastNotified = LS.get("cj_notified","");
setInterval(()=>{
  if(!S.loaded) return;
  const hm = nowHM(), key = today()+" "+hm;
  if("Notification" in window && Notification.permission==="granted" && lastNotified!==key){
    const due = meds().filter(m=>m.data.time===hm && m.data.type!=="rotina" && !doseFor(today(),m.id));
    if(due.length){ try{ new Notification("Hora do remédio · "+hm, {body: due.map(m=>m.data.name).join(", "), icon:"icon-192.png"}); }catch(e){} lastNotified=key; LS.set("cj_notified",key); }
  }
  if(!$("#sheet") && (S.tab==="hoje"||S.tab==="painel")) render();
}, 30000);
setInterval(()=>{ if(document.visibilityState==="visible" && !$("#sheet")) refresh(true); }, 20000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") refresh(true); });

render();
if(S.pin) refresh();
</script>
</body>
</html>
